name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install pytest
          pip install ./packages/common
      - name: Test
        env:
          PYTHONPATH: services/indexer
        run: |
          pytest packages/common services/indexer/test_index.py services/privacy/test_privacy.py services/serving/test_auction.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ protobuf-compiler pkg-config libssl-dev libsasl2-dev \
            zlib1g-dev libcurl4-openssl-dev libzstd-dev
      - name: Verify native headers
        run: |
          test -f /usr/include/x86_64-linux-gnu/curl/curl.h
          pkg-config --exists libcurl
      - name: Test serving
        working-directory: services/serving
        run: cargo test
        env:
          PROTO_FILE: ${{ github.workspace }}/proto/adpulse.proto
          CFLAGS: -I/usr/include/x86_64-linux-gnu
          CXXFLAGS: -I/usr/include/x86_64-linux-gnu
