global:
  scrape_interval: 5s

scrape_configs:
  - job_name: campaign
    static_configs:
      - targets: ["campaign:8001"]
    metrics_path: /metrics
  - job_name: indexer
    static_configs:
      - targets: ["indexer:8002"]
  - job_name: serving
    static_configs:
      - targets: ["serving:8000"]
  - job_name: analytics
    static_configs:
      - targets: ["analytics:8003"]
  - job_name: privacy
    static_configs:
      - targets: ["privacy:8004"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
