apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: adpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      containers:
        - name: indexer
          image: adpulse/indexer:local
          ports:
            - containerPort: 8002
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: adpulse-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: indexer
  namespace: adpulse
spec:
  selector:
    app: indexer
  ports:
    - name: http
      port: 8002
      targetPort: 8002
    - name: grpc
      port: 50051
      targetPort: 50051
