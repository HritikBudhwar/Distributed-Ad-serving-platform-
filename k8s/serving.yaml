apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  namespace: adpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: adpulse/serving:local
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: adpulse-config
          env:
            - name: HTTP_PORT
              value: "8000"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: serving
  namespace: adpulse
spec:
  selector:
    app: serving
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serving
  namespace: adpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: serving
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
