apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: adpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: adpulse/analytics:local
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: adpulse-config
          env:
            - name: HTTP_PORT
              value: "8003"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: adpulse
spec:
  selector:
    app: analytics
  ports:
    - port: 8003
      targetPort: 8003
