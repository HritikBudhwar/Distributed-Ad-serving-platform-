apiVersion: apps/v1
kind: Deployment
metadata:
  name: privacy
  namespace: adpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privacy
  template:
    metadata:
      labels:
        app: privacy
    spec:
      containers:
        - name: privacy
          image: adpulse/privacy:local
          ports:
            - containerPort: 8004
            - containerPort: 50052
          envFrom:
            - configMapRef:
                name: adpulse-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: privacy
  namespace: adpulse
spec:
  selector:
    app: privacy
  ports:
    - name: http
      port: 8004
      targetPort: 8004
    - name: grpc
      port: 50052
      targetPort: 50052
